name: CI

on:
  pull_request:
    branches:
      - main
      - pr1-sequential
  push:
    branches:
      - main
      - pr1-sequential
      - pr2-parallel

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format cmake pkg-config libcmocka-dev python3-pip

      - name: Install Python dependencies
        run: python3 -m pip install --user numpy scipy

      - name: Check formatting
        run: |
          git ls-files '*.c' '*.h' \
            | grep -v '^tests/fixtures.h$' \
            | xargs clang-format --dry-run --Werror

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build and run tests
        run: cmake --build build --target check --parallel
